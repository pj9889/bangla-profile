<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surovi Monipuri - Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --fb-blue: #0866ff; --fb-bg: #f0f2f5; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: var(--fb-bg); overflow-x: hidden; width: 100%; }

        /* Existing Design Styles */
        .cover { width: 100%; height: 180px; background: url('https://github.com/pj9889/picvid/blob/main/pic3.webp?raw=true') center/cover; }
        .profile-card { background: white; text-align: center; padding-bottom: 20px; border-bottom: 1px solid #ddd; }
        .pfp-wrap { position: relative; margin-top: -60px; display: inline-block; }
        .pfp { width: 140px; height: 140px; border-radius: 50%; border: 4px solid white; background: url('https://github.com/pj9889/picvid/blob/main/pic1.webp?raw=true') center/cover; }
        .online { position: absolute; bottom: 10px; right: 10px; width: 22px; height: 22px; background: #31a24c; border: 3px solid white; border-radius: 50%; }
        .name { font-size: 24px; font-weight: bold; margin: 10px 0 2px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .verified { color: #0866ff; font-size: 20px; }
        .bio { color: #65676b; font-style: italic; padding: 0 30px; margin-bottom: 15px; font-size: 14px; }

        .btn-row { display: flex; justify-content: center; gap: 10px; padding: 0 15px; }
        .btn { flex: 1; height: 40px; border-radius: 8px; border: none; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
        .btn-call { background: #E4E6EB; color: #050505; }
        .btn-msg { background: var(--fb-blue); color: white; }

        .post { background: white; margin-top: 10px; padding: 12px 0; }
        .post-header { padding: 0 12px 10px; display: flex; align-items: center; gap: 10px; }
        .mini-pfp { width: 40px; height: 40px; border-radius: 50%; background: url('https://github.com/pj9889/picvid/blob/main/pic1.webp?raw=true') center/cover; }
        .post-txt { padding: 0 12px 10px; font-size: 15px; line-height: 1.4; }
        .post-img { width: 100%; height: auto; }
        .post-stats { padding: 10px 12px; display: flex; justify-content: space-between; border-bottom: 1px solid #ebedf0; font-size: 13px; color: #65676b; }
        .post-actions { display: flex; padding: 4px 0; }
        .act-btn { flex: 1; text-align: center; padding: 8px 0; color: #65676b; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .liked { color: var(--fb-blue) !important; }

        /* UI Elements */
        #call-ui { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .c-btn { width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; color: white; border: none; cursor: pointer; }
        .c-accept { background: #31a24c; }
        .c-decline { background: #fa3e3e; }

        /* Custom Payment Template */
        #payment-box { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 20000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .pay-card { background: white; width: 100%; max-width: 350px; border-radius: 15px; overflow: hidden; position: relative; text-align: center; padding-bottom: 20px; }
        .pay-header { background: #f8f9fa; padding: 15px; border-bottom: 1px solid #eee; font-weight: bold; font-size: 18px; color: #fa3e3e; }
        .pay-option { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; border: 1px solid #ddd; margin: 10px 15px; border-radius: 10px; cursor: pointer; }
        .pay-option.selected { border-color: var(--fb-blue); background: #f0f7ff; }
        .pay-btn { background: var(--fb-blue); color: white; margin: 15px; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; display: block; }
        .back-icon { position: absolute; top: 15px; left: 15px; color: #666; font-size: 20px; cursor: pointer; }

        #video-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 11000; display: none; }
        #remote-video { width: 100%; height: 100%; object-fit: cover; }
        #local-cam { position: absolute; top: 20px; right: 20px; width: 90px; height: 130px; border-radius: 8px; border: 1px solid white; object-fit: cover; transform: scaleX(-1); }
    </style>
</head>
<body>

    <audio id="ringtone" loop preload="auto">
        <source src="https://github.com/pj9889/aud/raw/refs/heads/main/audio%20(2).mpeg" type="audio/mpeg">
    </audio>

    <div class="cover"></div>
    <div class="profile-card">
        <div class="pfp-wrap"><div class="pfp"></div><div class="online"></div></div>
        <div class="name">Surovi Monipuri <i class="fas fa-check-circle verified"></i></div>
        <div class="bio">"আমি সুরভী, কথা বলতে চাইলে কল দাও... ❤️"</div>
        <div class="btn-row">
            <button class="btn btn-call" onclick="triggerCall()"><i class="fas fa-video"></i> Video Call</button>
            <button class="btn btn-msg" onclick="openMessenger()"><i class="fab fa-facebook-messenger"></i> Message</button>
        </div>
    </div>

    <!-- Posts Content -->
    <div id="posts">
        <script>
            for(let i=1; i<=3; i++) {
                document.write(`
                    <div class="post">
                        <div class="post-header"><div class="mini-pfp"></div><div><b>Surovi Monipuri</b><br><small>${i}h ago</small></div></div>
                        <div class="post-txt">একটু একাকী অনুভব করছি, কেউ কি আছো গল্প করার? 😈🔥</div>
                        <img src="https://github.com/pj9889/picvid/blob/main/pic${i}.webp?raw=true" class="post-img" width="100%">
                        <div class="post-stats"><span><i class="fas fa-thumbs-up"></i> 5.4k</span> <span>${Math.floor(Math.random()*200)} Comments</span></div>
                        <div class="post-actions">
                            <div class="act-btn" onclick="this.classList.toggle('liked')"><i class="far fa-thumbs-up"></i> Like</div>
                            <div class="act-btn" onclick="alert('Something wrong')"><i class="far fa-comment"></i> Comment</div>
                            <div class="act-btn"><i class="far fa-share-square"></i> Share</div>
                        </div>
                    </div>
                `);
            }
        </script>
    </div>

    <!-- Call UI -->
    <div id="call-ui">
        <div style="text-align:center; margin-bottom:40px;">
            <img src="https://github.com/pj9889/picvid/blob/main/pic1.webp?raw=true" style="width:120px; height:120px; border-radius:50%; border:3px solid white;">
            <h2 style="margin-top:10px;">Surovi Monipuri</h2>
            <p id="call-status">Incoming Video Call...</p>
        </div>
        <div style="display:flex; gap:60px;">
            <button class="c-btn c-decline" onclick="endCall()"><i class="fas fa-phone-slash"></i></button>
            <button id="accept-btn" class="c-btn c-accept" onclick="acceptCall()"><i class="fas fa-video"></i></button>
        </div>
    </div>

    <!-- Video View -->
    <div id="video-container">
        <video id="remote-video" playsinline><source src="https://github.com/pj9889/ppp/raw/refs/heads/main/video2.mp4" type="video/mp4"></video>
        <video id="local-cam" autoplay playsinline muted></video>
        <button onclick="endCall()" style="position:absolute; bottom:50px; left:50%; transform:translateX(-50%); width:70px; height:70px; background:#fa3e3e; border-radius:50%; border:none; color:white; font-size:30px;"><i class="fas fa-phone-slash"></i></button>
    </div>

    <!-- Payment Template -->
    <div id="payment-box">
        <div class="pay-card">
            <i class="fas fa-arrow-left back-icon" onclick="closePay()"></i>
            <div class="pay-header">আপনার ডেমো সার্ভিস শেষ</div>
            <p style="padding:10px; color:#666;">ভিডিও কলে সরাসরি কথা বলতে সার্ভিস কিনুন</p>
            
            <div class="pay-option selected" onclick="selectOption(this)">
                <span>৫ মিনিট</span>
                <b>১৫০ টাকা</b>
            </div>
            <div class="pay-option" onclick="selectOption(this)">
                <span>১০ মিনিট</span>
                <b>১৯৯ টাকা</b>
            </div>
            
            <a href="https://safeoffers.pro/a/1rypFXB3uXm3P" class="pay-btn">পেমেন্ট করুন</a>
        </div>
    </div>

    <script>
        let demoUsed = false;
        let secondCallTriggered = false;
        let msgCount = 0;
        const ringtone = document.getElementById('ringtone');

        // ২০ সেকেন্ড পর প্রথম ডেমো কল
        setTimeout(() => {
            if(!demoUsed) startCall(true);
        }, 20000);

        function triggerCall() {
            if(!demoUsed) {
                startCall(false); // ভিজিটর নিজে কল দিলে
            } else {
                showPayment();
            }
        }

        function startCall(isIncoming) {
            document.getElementById('call-ui').style.display = 'flex';
            if(isIncoming) {
                ringtone.play().catch(()=>{});
                document.getElementById('accept-btn').style.display = 'flex';
                document.getElementById('call-status').innerText = "Incoming Video Call...";
            } else {
                document.getElementById('accept-btn').style.display = 'none';
                document.getElementById('call-status').innerText = "Ringing...";
                setTimeout(acceptCall, 3000);
            }
        }

        function acceptCall() {
            ringtone.pause();
            if(secondCallTriggered) {
                document.getElementById('call-ui').style.display = 'none';
                showPayment();
                return;
            }
            document.getElementById('call-ui').style.display = 'none';
            document.getElementById('video-container').style.display = 'block';
            document.getElementById('remote-video').play();
            
            // ডেমো কল ১২ সেকেন্ড পর কেটে যাবে
            setTimeout(endCall, 12000);
        }

        function endCall() {
            ringtone.pause();
            document.getElementById('video-container').style.display = 'none';
            document.getElementById('call-ui').style.display = 'none';
            
            if(!demoUsed) {
                demoUsed = true;
                // ডেমো শেষ হওয়ার ২ সেকেন্ড পর ২য় কল
                setTimeout(() => {
                    secondCallTriggered = true;
                    startCall(true);
                }, 2000);
            }
        }

        function openMessenger() {
            if(secondCallTriggered) { showPayment(); return; }
            let text = prompt("সুরভীকে মেসেজ লিখুন...");
            if(text && msgCount === 0) {
                msgCount++;
                setTimeout(() => {
                    alert("সুরভী: জান আমাকে কল দাও, আমি তোমাকে আমার সব খুলে দেখাবো এবং আঙ্গুল দিয়ে দেখাবো, ডেমো শেষ হয়ে গেলে সার্ভিস কিনো❤️");
                }, 5000);
            } else if(text && demoUsed) {
                showPayment();
            }
        }

        function showPayment() {
            document.getElementById('payment-box').style.display = 'flex';
        }

        function closePay() {
            document.getElementById('payment-box').style.display = 'none';
        }

        function selectOption(el) {
            document.querySelectorAll('.pay-option').forEach(opt => opt.classList.remove('selected'));
            el.classList.add('selected');
        }
    </script>
</body>
</html>
